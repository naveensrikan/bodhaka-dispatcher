name: Build Windows Installer

on:
  # Build on every push to main (so you always have a fresh dev build)
  push:
    branches: [main, master]
    tags: ['v*']
  # Build on PRs so you can verify before merging
  pull_request:
    branches: [main, master]
  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }
        shell: pwsh

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        run: npm run package:win
        env:
          # electron-builder uses this to skip code signing in dev builds
          # (real code signing requires a paid cert — we add that later)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List built files (for debugging)
        run: dir release
        shell: cmd

      # Upload the installer as an artifact you can download from any build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-agent-builder-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          retention-days: 30

      # If this is a tag push (e.g. v0.1.0), create a GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
